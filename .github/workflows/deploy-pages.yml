name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main, arena/01a0fe07-portfolio]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fail with a readable message instead of a cryptic API error when the
      # repository has not been switched over to Actions-based Pages yet.
      - name: Check that Pages is enabled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")

          if [ "$status" != "200" ]; then
            echo "::error title=GitHub Pages is not enabled::Turn it on once: Settings -> Pages -> Build and deployment -> Source: \"GitHub Actions\". Then re-run this workflow."
            exit 1
          fi
          echo "Pages is enabled."

      # `enablement` is deliberately left off: creating the Pages site requires
      # an admin-scoped token that GITHUB_TOKEN does not have, so asking for it
      # only produces a confusing failure.
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Publish only the site itself — not .git, README, LICENSE or the workflow.
      - name: Stage site
        run: |
          mkdir -p _site
          cp -r index.html 404.html .nojekyll assets _site/

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
